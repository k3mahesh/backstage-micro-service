# ──────────────────────────────────────────────────────────────────────────────
# Nginx — Static File Server for the Backstage React SPA
#
# This container no longer handles API routing. All /api/* traffic is routed
# by Envoy (see envoy.yaml). Nginx only serves the pre-built React bundle
# and provides the SPA fallback so client-side routes (e.g. /catalog, /docs)
# return index.html instead of 404.
#
# Listens on port 8080 (internal only). Envoy is the only ingress on port 80.
# ──────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unknown paths serve index.html so React Router handles them
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
