# ──────────────────────────────────────────────────────────────────────────────
# Nginx — API Gateway + Static File Server for Backstage
#
# Routing table:
#   /api/catalog/*      → backend-catalog:7008
#   /api/search/*       → backend-catalog:7008  (search runs alongside catalog)
#   /api/kubernetes/*   → backend-catalog:7008
#   /api/scaffolder/*   → backend-scaffolder:7009
#   /api/techdocs/*     → backend-techdocs:7010
#   /api/*              → backend-core:7007      (auth, proxy, permissions, signals…)
#   /*                  → React SPA (index.html)
# ──────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # Gzip static assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  upstream backend_core {
    server backend-core:7007;
  }

  upstream backend_catalog {
    server backend-catalog:7008;
  }

  upstream backend_scaffolder {
    server backend-scaffolder:7009;
  }

  upstream backend_techdocs {
    server backend-techdocs:7010;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Catalog + Search + Kubernetes → backend-catalog ──────────────────────
    location ~ ^/api/(catalog|search|kubernetes)/ {
      proxy_pass         http://backend_catalog;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }

    # ── Scaffolder → backend-scaffolder ──────────────────────────────────────
    location /api/scaffolder/ {
      proxy_pass         http://backend_scaffolder;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # ── TechDocs → backend-techdocs ──────────────────────────────────────────
    location /api/techdocs/ {
      proxy_pass         http://backend_techdocs;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # ── Everything else (auth, proxy, signals, notifications) → backend-core ─
    location /api/ {
      proxy_pass         http://backend_core;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      # WebSocket support for signals (real-time notifications)
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }

    # ── React SPA fallback ────────────────────────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
