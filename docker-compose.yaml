# ──────────────────────────────────────────────────────────────────────────────
# Backstage — Microservice Docker Compose
#
# Services:
#   nginx            → port 80  — API gateway + React SPA (entry point for browser)
#   backend-core     → port 7007 — Auth, Proxy, Permissions, Notifications, Signals
#   backend-catalog  → port 7008 — Catalog, Search, Kubernetes
#   backend-scaffolder → port 7009 — Scaffolder, GitHub actions
#   backend-techdocs → port 7010 — TechDocs
#   postgres         → port 5432 — Shared database for all backends
#
# How config works:
#   app-config.yaml          → base defaults (same for all backends)
#   app-config.production.yaml → reads ${BACKEND_BASE_URL}, ${POSTGRES_DB}, etc.
#   Each service sets its own BACKEND_BASE_URL, BACKEND_LISTEN_PORT, POSTGRES_DB
#   via environment variables, no APP_CONFIG_ prefix needed.
#
# Quick start:
#   1. cp .env.example .env   (fill in BACKEND_SECRET, GITHUB_TOKEN, POSTGRES_PASSWORD)
#   2. docker compose build
#   3. docker compose up
#   4. Open http://localhost
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx: API Gateway + Frontend ─────────────────────────────────────────
  nginx:
    platform: linux/amd64
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend-core
      - backend-catalog
      - backend-scaffolder
      - backend-techdocs
    restart: unless-stopped

  # ── Backend A: Core ────────────────────────────────────────────────────────
  backend-core:
    platform: linux/amd64
    build:
      context: .
      dockerfile: packages/backend-core/Dockerfile
    ports:
      - "7007:7007"
    environment:
      BACKEND_BASE_URL: "http://backend-core:7007"
      BACKEND_LISTEN_PORT: "7007"
      BACKEND_SECRET: ${BACKEND_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage_core
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend B: Catalog + Search + Kubernetes ───────────────────────────────
  backend-catalog:
    platform: linux/amd64
    build:
      context: .
      dockerfile: packages/backend-catalog/Dockerfile
    ports:
      - "7008:7008"
    environment:
      BACKEND_BASE_URL: "http://backend-catalog:7008"
      BACKEND_LISTEN_PORT: "7008"
      BACKEND_SECRET: ${BACKEND_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage_catalog
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend C: Scaffolder ──────────────────────────────────────────────────
  backend-scaffolder:
    platform: linux/amd64
    build:
      context: .
      dockerfile: packages/backend-scaffolder/Dockerfile
    ports:
      - "7009:7009"
    environment:
      BACKEND_BASE_URL: "http://backend-scaffolder:7009"
      BACKEND_LISTEN_PORT: "7009"
      BACKEND_SECRET: ${BACKEND_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage_scaffolder
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend D: TechDocs ────────────────────────────────────────────────────
  backend-techdocs:
    platform: linux/amd64
    build:
      context: .
      dockerfile: packages/backend-techdocs/Dockerfile
    ports:
      - "7010:7010"
    environment:
      BACKEND_BASE_URL: "http://backend-techdocs:7010"
      BACKEND_LISTEN_PORT: "7010"
      BACKEND_SECRET: ${BACKEND_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage_techdocs
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - techdocs-storage:/tmp/techdocs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Postgres: Shared database ──────────────────────────────────────────────
  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: backstage_core,backstage_catalog,backstage_scaffolder,backstage_techdocs
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  techdocs-storage:
