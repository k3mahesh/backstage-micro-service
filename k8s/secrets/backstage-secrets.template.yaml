# ──────────────────────────────────────────────────────────────────────────────
# Secret template — COMMIT THIS FILE (values are placeholders)
#
# To create the real secret on the cluster:
#   1. Copy this file: cp backstage-secrets.template.yaml backstage-secrets.yaml
#   2. Replace every <CHANGE_ME> with the actual value
#   3. Base64-encode each value: echo -n "myvalue" | base64
#   4. kubectl apply -f backstage-secrets.yaml
#   5. Never commit backstage-secrets.yaml (it is .gitignored)
#
# Or use AWS SSM + a bootstrap script (see deploy-on-aws.md).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
data:
  # echo -n "$(node -e "console.log(require('crypto').randomBytes(24).toString('base64'))")" | base64
  BACKEND_SECRET: <BASE64_ENCODED_BACKEND_SECRET>

  # echo -n "ghp_yourtoken" | base64
  GITHUB_TOKEN: <BASE64_ENCODED_GITHUB_TOKEN>

  # echo -n "yourpassword" | base64
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>
