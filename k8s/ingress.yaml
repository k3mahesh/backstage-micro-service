# ──────────────────────────────────────────────────────────────────────────────
# Ingress — Backstage POC
#
# Uses the cluster's existing nginx ingress controller (ingress-nginx namespace).
# Routes all traffic for backstage-poc-aws.opstree.dev to Envoy, which then
# distributes requests internally to frontend / backend-* services.
#
# Traffic flow:
#   browser → shared NLB → nginx ingress controller → envoy:80 → services
#
# Prerequisites:
#   - DNS: add a CNAME for backstage-poc-aws.opstree.dev pointing to the same
#     NLB as backstage-aws.opstree.dev (check with: kubectl get ingress -n backstage)
#   - TLS: cert-manager ClusterIssuer must exist in the cluster
#     (check with: kubectl get clusterissuer)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-poc-ingress
  namespace: backstage-poc
  labels:
    app: backstage-poc
  annotations:
    # Use the nginx ingress controller (same one used by backstage + keycloak)
    kubernetes.io/ingress.class: "nginx"

    # Force HTTP → HTTPS redirect (matches existing backstage-ingress behaviour)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Increase timeouts for WebSocket connections (Backstage signals / live updates)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Allow larger request bodies (scaffolder template uploads etc.)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  # TLS — uses the wildcard cert copied from the backstage namespace.
  # Copy command (run once on bastion):
  #   kubectl get secret backstage-tls -n backstage -o json \
  #     | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations,.metadata.labels)' \
  #     | jq '.metadata.name = "backstage-poc-tls"' \
  #     | kubectl apply -n backstage-poc -f -
  tls:
  - hosts:
    - backstage-poc-aws.opstree.dev
    secretName: backstage-poc-tls
  rules:
  - host: backstage-poc-aws.opstree.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: envoy
            port:
              number: 80
