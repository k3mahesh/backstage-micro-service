# ──────────────────────────────────────────────────────────────────────────────
# Backend Catalog — Catalog, Search, Kubernetes plugin
# Replace <ECR_REGISTRY> with your ECR URI before applying.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-catalog
  namespace: backstage-poc
  labels:
    app: backend-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-catalog
  template:
    metadata:
      labels:
        app: backend-catalog
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: application
        effect: NoSchedule
      containers:
      - name: backend-catalog
        image: <ECR_REGISTRY>/backend-catalog:latest
        ports:
        - containerPort: 7008
        env:
        - name: APP_BASE_URL
          value: "http://<ENVOY_LB_DNS>"
        - name: BACKEND_BASE_URL
          value: "http://backend-catalog:7008"
        - name: BACKEND_LISTEN_PORT
          value: "7008"
        - name: CORS_ORIGIN
          value: "http://<ENVOY_LB_DNS>"
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: backstage
        - name: POSTGRES_DB
          value: backstage_catalog
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: BACKEND_SECRET
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: POSTGRES_PASSWORD
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: GITHUB_TOKEN
        volumeMounts:
        - name: app-config
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        - name: app-config-production
          mountPath: /app/app-config.production.yaml
          subPath: app-config-production.yaml
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 7008
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7008
          initialDelaySeconds: 60
          periodSeconds: 20
      volumes:
      - name: app-config
        configMap:
          name: app-config
      - name: app-config-production
        configMap:
          name: app-config-production
---
apiVersion: v1
kind: Service
metadata:
  name: backend-catalog
  namespace: backstage-poc
  labels:
    app: backend-catalog
spec:
  selector:
    app: backend-catalog
  ports:
  - port: 7008
    targetPort: 7008
  type: ClusterIP
