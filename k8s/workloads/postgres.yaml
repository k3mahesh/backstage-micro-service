# ──────────────────────────────────────────────────────────────────────────────
# PostgreSQL — single replica for POC
# StatefulSet (not Deployment) so the PVC binding is stable.
# Init script creates one database per Backstage microservice on first start.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: backstage-poc
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: database
        effect: NoSchedule
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: backstage
        - name: POSTGRES_DB
          value: postgres   # default db; init script creates the service-specific ones
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d/init.sh
          subPath: init.sh
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          exec:
            command: [pg_isready, -U, backstage]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [pg_isready, -U, backstage]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: postgres-init
        configMap:
          name: postgres-init
          defaultMode: 0755   # make init.sh executable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: backstage-poc
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None   # headless service — StatefulSet pods are addressed directly
