# ──────────────────────────────────────────────────────────────────────────────
# Envoy — Internal routing proxy
# Receives traffic from the nginx ingress controller and routes to the correct
# backend service based on the request path.
#
# Traffic flow:
#   internet → nginx ingress (shared NLB) → envoy:80 → frontend/backend-*
#
# The Envoy Service is ClusterIP — no AWS NLB is created by this file.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: backstage-poc
  labels:
    app: envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # never start a new pod before the old one is gone
      maxUnavailable: 1  # terminate the old pod first, then start the new one
  template:
    metadata:
      labels:
        app: envoy
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: application
        effect: NoSchedule
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.31-latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 9901
          name: admin
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
# Internal ClusterIP Service — nginx ingress routes to this.
# Traffic path: internet → nginx ingress (NLB) → envoy → frontend / backends
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: backstage-poc
  labels:
    app: envoy
spec:
  selector:
    app: envoy
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
---
# Internal-only service for Envoy admin — never expose publicly
apiVersion: v1
kind: Service
metadata:
  name: envoy-admin
  namespace: backstage-poc
  labels:
    app: envoy
spec:
  selector:
    app: envoy
  ports:
  - name: admin
    port: 9901
    targetPort: 9901
  type: ClusterIP
