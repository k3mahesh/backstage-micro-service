# ──────────────────────────────────────────────────────────────────────────────
# Backend TechDocs — Documentation site generation and serving
# Replace <ECR_REGISTRY> with your ECR URI before applying.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-techdocs
  namespace: backstage-poc
  labels:
    app: backend-techdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-techdocs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # never start a new pod before the old one is gone
      maxUnavailable: 1  # terminate the old pod first, then start the new one
  template:
    metadata:
      labels:
        app: backend-techdocs
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: application
        effect: NoSchedule
      containers:
      - name: backend-techdocs
        image: <ECR_REGISTRY>/backend-techdocs:latest
        ports:
        - containerPort: 7010
        env:
        - name: APP_BASE_URL
          value: "https://backstage-poc-aws.opstree.dev"
        - name: BACKEND_BASE_URL
          value: "https://backstage-poc-aws.opstree.dev"  # public URL — used by browser to reach the API
        - name: BACKEND_LISTEN_PORT
          value: "7010"
        - name: CORS_ORIGIN
          value: "https://backstage-poc-aws.opstree.dev"
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: backstage
        - name: POSTGRES_DB
          value: backstage_techdocs
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: BACKEND_SECRET
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: app-config
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        - name: techdocs-storage
          mountPath: /tmp/techdocs
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 7010
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7010
          initialDelaySeconds: 60
          periodSeconds: 20
      volumes:
      - name: app-config
        configMap:
          name: app-config
      - name: techdocs-storage
        emptyDir: {}   # POC only — generated docs lost on pod restart; use S3 in production
---
apiVersion: v1
kind: Service
metadata:
  name: backend-techdocs
  namespace: backstage-poc
  labels:
    app: backend-techdocs
spec:
  selector:
    app: backend-techdocs
  ports:
  - port: 7010
    targetPort: 7010
  type: ClusterIP
