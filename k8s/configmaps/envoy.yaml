# ──────────────────────────────────────────────────────────────────────────────
# ConfigMap: envoy-config
# Mounted into the Envoy pod at /etc/envoy/envoy.yaml.
# In K8s, cluster addresses use K8s Service DNS names (same namespace).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: backstage-poc
data:
  envoy.yaml: |
    static_resources:

      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 80
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              upgrade_configs:
              - upgrade_type: websocket
              route_config:
                name: backstage_routes
                virtual_hosts:
                - name: backstage
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/api/catalog/" }
                    route: { cluster: backend_catalog, timeout: 30s }
                  - match: { prefix: "/api/search/" }
                    route: { cluster: backend_catalog, timeout: 30s }
                  - match: { prefix: "/api/kubernetes/" }
                    route: { cluster: backend_catalog, timeout: 30s }
                  - match: { prefix: "/api/scaffolder/" }
                    route: { cluster: backend_scaffolder, timeout: 300s }
                  - match: { prefix: "/api/techdocs/" }
                    route: { cluster: backend_techdocs, timeout: 60s }
                  - match: { prefix: "/api/" }
                    route:
                      cluster: backend_core
                      timeout: 30s
                      upgrade_configs:
                      - upgrade_type: websocket
                  - match: { prefix: "/" }
                    route: { cluster: frontend, timeout: 10s }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: frontend
        connect_timeout: 0.25s
        type: STRICT_DNS
        load_assignment:
          cluster_name: frontend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: frontend, port_value: 8080 }

      - name: backend_core
        connect_timeout: 0.25s
        type: STRICT_DNS
        load_assignment:
          cluster_name: backend_core
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: backend-core, port_value: 7007 }

      - name: backend_catalog
        connect_timeout: 0.25s
        type: STRICT_DNS
        load_assignment:
          cluster_name: backend_catalog
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: backend-catalog, port_value: 7008 }

      - name: backend_scaffolder
        connect_timeout: 0.25s
        type: STRICT_DNS
        load_assignment:
          cluster_name: backend_scaffolder
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: backend-scaffolder, port_value: 7009 }

      - name: backend_techdocs
        connect_timeout: 0.25s
        type: STRICT_DNS
        load_assignment:
          cluster_name: backend_techdocs
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: backend-techdocs, port_value: 7010 }

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
