# ──────────────────────────────────────────────────────────────────────────────
# ConfigMap: app-config
# Single source of truth for all environments.
# Environment-specific values are injected via env vars from each Deployment.
# Mounted into every backend pod at /app/app-config.yaml.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: backstage-poc
data:
  app-config.yaml: |
    app:
      title: Scaffolded Backstage App
      baseUrl: ${APP_BASE_URL}
      packages: all

    organization:
      name: My Company

    backend:
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      baseUrl: ${BACKEND_BASE_URL}
      listen:
        port: ${BACKEND_LISTEN_PORT}
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      cors:
        origin:
          - ${APP_BASE_URL}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DB}
      actions:
        pluginSources:
          - auth
          - catalog
          - scaffolder

    discovery:
      endpoints:
        # backend-core hosts: auth, proxy, permissions, notifications, signals, user-settings
        # Must be listed explicitly so other backends use the internal K8s DNS name
        # instead of falling back to backend.baseUrl (the public URL), which is
        # unreachable from inside the cluster (no hairpin routing through nginx ingress).
        - target: 'http://backend-core:7007/api/{{pluginId}}'
          plugins: [auth, proxy, permission, notifications, signals, user-settings]
        - target: 'http://backend-catalog:7008/api/{{pluginId}}'
          plugins: [catalog, search, kubernetes]
        - target: 'http://backend-scaffolder:7009/api/{{pluginId}}'
          plugins: [scaffolder]
        - target: 'http://backend-techdocs:7010/api/{{pluginId}}'
          plugins: [techdocs]

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    scaffolder: {}

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location]
      locations:
        - type: file
          target: ./examples/entities.yaml
        - type: file
          target: ./examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ./examples/org.yaml
          rules:
            - allow: [User, Group]

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters: []   # no clusters configured — plugin starts without crashing

    permission:
      enabled: true

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'
