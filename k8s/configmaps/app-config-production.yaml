# ──────────────────────────────────────────────────────────────────────────────
# ConfigMap: app-config-production
# Mounted into every backend pod at /app/app-config.production.yaml.
# Values are resolved from environment variables injected by each Deployment.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-production
  namespace: backstage-poc
data:
  app-config.production.yaml: |
    app:
      # APP_BASE_URL = the Envoy LoadBalancer DNS, e.g. http://a1b2c3.elb.amazonaws.com
      baseUrl: ${APP_BASE_URL}

    backend:
      baseUrl: ${BACKEND_BASE_URL}
      listen:
        port: ${BACKEND_LISTEN_PORT}
      cors:
        origin:
          - ${APP_BASE_URL}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DB}

    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    catalog:
      locations:
        - type: file
          target: ./examples/entities.yaml
        - type: file
          target: ./examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ./examples/org.yaml
          rules:
            - allow: [User, Group]
